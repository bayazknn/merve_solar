[project]
name = "merve-solar-uq"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "seaborn>=0.13,<0.15",
]

# A dependency-group, not an optional-dependency (extra): `uv sync --dev` syncs groups, so
# declaring pytest as an extra meant the documented install command actively UNINSTALLED it,
# leaving `uv run pytest` to fall through to whatever pytest was on PATH.
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merve_solar"]
